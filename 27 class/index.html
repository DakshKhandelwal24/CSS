<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rectangle Grid Layout</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: white;
    }

    .layout {
      display: grid;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      aspect-ratio: 423 / 290;
      border-top: 2px solid black;
      border-left: 2px solid black;

      grid-template-columns: 85fr 88fr 87fr 163fr;
      grid-template-rows: 49fr 53fr 60fr 95fr;
      grid-template-areas:
        "big narrow thin1 thin2"
        "big narrow thin1 thin2"
        "big mid mid mid"
        "vl mid mid mid"
        "vl vr vr bottom";
    }

    .layout div {
      border-right: 2px solid black;
      border-bottom: 2px solid black;
      background-color: white;
    }

    .big    { grid-area: big; }
    .narrow { grid-area: narrow; }
    .thin1  { grid-area: thin1; }
    .thin2  { grid-area: thin2; }
    .mid    { grid-area: mid; }
    .vl     { grid-area: vl; }
    .vr     { grid-area: vr; }
    .bottom { grid-area: bottom; }

    @media (max-width: 700px) {
      .layout {
        max-width: 300px;
        aspect-ratio: 194 / 293;

        grid-template-columns: 78fr 25fr 91fr;
        grid-template-rows: 70fr 45fr 87fr 91fr;
        grid-template-areas:
          "big mid mid mid"
          "big narrow thin1 thin2"
          "vl vr bottom bottom"
          "vl vr bottom bottom";
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <div class="big"><h1>1</h1></div>
    <div class="narrow"><h1>2</h1></div>
    <div class="thin1"><h1>3</h1></div>
    <div class="thin2"><h1>4</h1></div>
    <div class="mid"><h1>5</h1></div>
    <div class="vl"><h1>6</h1></div>
    <div class="vr"><h1>7</h1></div>
    <div class="bottom"><h1>8</h1></div>
  </div>
</body>
</html>

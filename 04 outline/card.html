<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
  --primary-blue: #4d73ff;
  --text-dark: #333333;
  --text-muted: #666666;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background-color: #f5f7fb;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
}

.profile-card {
  width: 320px;
  background: #ffffff;
  border-radius: 24px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
  overflow: hidden;
  text-align: center;
}

.card-header {
  background-color: var(--primary-blue);
  height: 160px;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  position: relative;
  /* Creates the smooth curved wave at the bottom right of the blue section */
  border-bottom-right-radius: 60px; 
}

/* Optional pseudo-element to perfectly match the inverted corner curve if needed */
.card-header::after {
  content: '';
  position: absolute;
  bottom: -40px;
  right: 0;
  width: 40px;
  height: 40px;
  background: var(--primary-blue);
  border-top-left-radius: 40px;
  z-index: -1;
}

.avatar-container {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 4px solid rgba(255, 255, 255, 0.6);
  background: #ffffff;
  overflow: hidden;
  position: absolute;
  bottom: -40px; /* Positions the photo halfway overlapping both sections */
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}

.avatar-container img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.card-body {
  padding: 60px 24px 32px 24px;
  background: #ffffff;
  /* Matches the complementary curve inversion */
  border-top-left-radius: 40px; 
}

.user-name {
  font-size: 1.4rem;
  color: var(--text-dark);
  margin: 0 0 12px 0;
  font-weight: 600;
}

.description {
  font-size: 0.95rem;
  color: var(--text-muted);
  line-height: 1.5;
  margin: 0 0 24px 0;
}

.view-more-btn {
  background-color: var(--primary-blue);
  color: #ffffff;
  border: none;
  padding: 12px 36px;
  font-size: 0.95rem;
  font-weight: 500;
  border-radius: 12px;
}

.view-more-btn:hover {
  background-color: #3b5ecc;
}

.view-more-btn:active {
  transform: scale(0.98);
}

    </style>
</head>
<body>
    <div class="profile-card">
  <div class="card-header">
    <div class="avatar-container">
      <img src="https://placeholder.com" alt="David Dell">
    </div>
  </div>
  <div class="card-body">
    <h2 class="user-name">David Dell</h2>
    <p class="description">
      The lorem text the section contain contains header having open andclose functionality.
    </p>
    <button class="view-more-btn">View More</button>
  </div>
</div>

</body>
</html>

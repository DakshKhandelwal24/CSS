<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>/* Reset and Base Styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #f5f5f5;
    font-family: 'Poppins', sans-serif;
}

/* Banner Container */
.banner {
    position: relative;
    width: 100%;
    max-width: 1200px;
    height: 320px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    overflow: hidden;
    
    /* Image Background: Main coral pink gradient and right-hand side geometric cuts */
    background: 
        linear-gradient(135deg, transparent 75%, #ffcc00 75%, #ffcc00 85%, #0099ff 85%),
        radial-gradient(circle at 30% 120%, #e63956 0%, #ff4a6b 100%);
    
    padding: 0 8%;
}

/* Optional wavy graphic detail at the bottom */
.banner::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 40px;
    background: radial-gradient(circle at 35% 200%, transparent 60%, rgba(255, 255, 255, 0.08) 62%);
    pointer-events: none;
}

/* Typography Styling */
.banner-text {
    z-index: 2;
    color: #ffffff;
}

.banner-text h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 3.5rem;
    line-height: 1.15;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 20px;
}

.banner-text .hashtag {
    font-family: 'Poppins', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    opacity: 0.9;
}

/* Image Placement and Masking */
.banner-image {
    position: absolute;
    right: 5%;
    bottom: 0;
    height: 100%;
    display: flex;
    align-items: flex-end;
    z-index: 1;
}

.banner-image img {
    height: 95%;
    object-fit: contain;
    /* Adjust positioning based on your image dimensions */
    transform: translateY(5px); 
}

/* Responsive Scaling for Tablets and Mobile Screens */
@media (max-width: 768px) {
    .banner {
        height: 240px;
        padding: 0 5%;
        background: radial-gradient(circle at 30% 120%, #e63956 0%, #ff4a6b 100%);
    }

    .banner-text h1 {
        font-size: 2.2rem;
    }
    
    .banner-text .hashtag {
        font-size: 0.85rem;
    }

    .banner-image img {
        height: 80%;
    }
}
</style>
</head>
<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promo Banner</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Serif Headings -->
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <div class="banner">
        <div class="banner-text">
            <h1>Shop.<br>Have Fun.<br>Repeat.</h1>
            <p class="hashtag">#NewAndNow</p>
        </div>


        <div class="banner-image">
  
            <img src="https://unsplash.com" alt="Happy jumping kids">
        </div>
    </div>

</body>
</html>

</body>
</html>

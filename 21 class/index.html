<!DOCTYPE html>

    <title>Rotated Transform Demo</title>
<style>     
        body {

            padding: 0;

            height: 100vh;
            overflow: hidden;
        }

        /* Top-left tall bordered box */
        .box-1 {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 180px;
            height: 280px;
            border: 2px solid #000;
            background-color: transparent;
        }

        /* The container acting as the perspective parent */
        .perspective-parent {
            position: absolute;
            top: 290px;
            left: 330px;
            /* Dimensions adjusted to fit the 100x100 child nicely */
            width: 200px; 
            height: 100px;
            border: 1px solid #000;
            background-color: transparent;
            perspective: 800px; /* Added to give 3D transforms depth */
        }

        /* The red box is now the child element */
        .child {
            height: 100px;
            width: 100px;
            padding: 20px;
            background-color: red;
            color: #000;
            box-sizing: border-box;
            font-size: 12px; /* Reduced slightly to fit text */
            
            transition-delay: 2s;
            /* Note: The transition is commented out in your screenshot. 
               Uncomment the next line if you want the hover to animate smoothly: */

        }

        /* Hover effect triggering the 3D transform and color change */
        .perspective-parent:hover > .child {
            transform: scale3d(1.3, 2, 5) rotate3d(1, 1, 1, 45deg);
            background-color: blue;
        }
    </style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation </title>
    <style>
        .parent{
            perspective: 400px;

        }
        .child{

        }
        @keyframes spin{
            25%{
                transform:translateX(200px);
                background-color: purple;
                
            }
            50%{
                transform: translatey(200px);
                background-color: rgb(23, 20, 198);
            }
            75%{
                transform:translate(-200px);

            } 

             100%{
                transform: translatey(-200px);
                background-color: rgb(144, 70, 145);
            } 
             100%{
                transform: translateZ(500px);
                background-color: black;
            }
            25%{
                transform: scale3d(0,1,0);

            }
            50%{
                transform: scale3d(1,2,1.5);
            }
            100%{
                transform: scale3d(2,2,2);
                background-image: url(coconut-tree-svgrepo-com\ \(1\).svg );
            }
            
        } 
        .animate{
            height: 250px;
            width: 200px;
            margin-top: 150px;
            margin-left: 200px;
            padding: auto;
            background-color: rgb(5, 183, 43);
            border: 10px solid brown;
            animation-name: spin;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            animation-delay: 0s;
            animation-fill-mode:backwards;
            

        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child"></div>
    </div>
    <div class="animate">

    </div>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform Demo</title>
    <style>
        body {
            /* Using an off-white background similar to the screen photo */
            background-color: #f4efeb; 
            padding: 40px;
            font-family: serif;
        }

        .border-box {
            width: 250px;
            height: 350px;
            border: 1px solid #000;
            margin-bottom: 30px;
        }

        .red-box {
            width: 180px;
            height: 160px;
            background-color: red;
            color: #000;
            padding: 20px;
            box-sizing: border-box;
            
            /* The text inside indicates a 3D translation */
            transform: translate3d(0px, 0px, -50px);
        }
    </style>
</head>
<body>

    <div class="border-box"></div>
    
    <div class="red-box">
        Translated 0px, <br>
        0px, -50px
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <style>
        .main {
            /* border: 2px solid gray; */
            height: 600px;
            width: 350px;
            background-color: #1C1C1C;


        }

        .ans {
            /* border: 2px solid rgb(253, 0, 0); */
            height: 130px;
            width: 100%;
            color: white;
            font-size: 90px;
            display: flex;
            justify-content: flex-end;
            align-items: last baseline;
        }

        .r2 {
            /* border: 2px solid rgb(25, 253, 0); */
            width: 100%;
            height: 90px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;

        }

        .circle {
            /* border: 2px solid blue; */
            height: 60px;
            width: 60px;
            border-radius: 50%;
            background-color:#505050;
            font-size: 25px;
            font-weight: 500;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;

        }
        .r2 :nth-child(4){
            background-color: #FF9500;
        }
        .num{
            background-color:#A2A2A2;
            color: black;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="ans">
            7744
        </div>
        <div class="r2">
            <div class="circle num">C</div>
            <div class="circle num">+/-</div>
            <div class="circle num">%</div>
            <div class="circle">÷</div>
        </div>
        <div class="r2">
            <div class="circle">7</div>
            <div class="circle">8</div>
            <div class="circle">9</div>
            <div class="circle">x</div>
        </div>
        <div class="r2">
            <div class="circle">4</div>
            <div class="circle">5</div>
            <div class="circle">6</div>
            <div class="circle">-</div>
        </div>
        <div class="r2">
            <div class="circle">1</div>
            <div class="circle">2</div>
            <div class="circle">3</div>
            <div class="circle">+</div>
        </div>
        <div class="r2">
            <div class="circle" style="width: 120px; border-radius: 35px;display: flex;justify-content: left;padding-left: 15px;"><p>0</p></div>
            <div class="circle">,</div>
            <div class="circle">=</div>
        </div>
    </div>


</body>

</html>

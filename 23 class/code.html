<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation </title>
    <style>
        .parent{
            perspective: 400px;

        }
        .child{

        }
        @keyframes spin{
            25%{
                transform:translateX(200px);
                background-color: purple;
                
            }
            50%{
                transform: translatey(200px);
                background-color: rgb(23, 20, 198);
            }
            75%{
                transform:translate(-200px);

            } 

             /* 100%{
                transform: translatey(-200px);
                background-color: rgb(144, 70, 145);
            } 
             100%{
                transform: translateZ(500px);
                background-color: black;
            } */
            25%{
                transform: scale3d(0,1,0);

            }
            50%{
                transform: scale3d(1,2,1.5);
            }
            100%{
                transform: scale3d(2,2,2);
                background-image: url(coconut-tree-svgrepo-com\ \(1\).svg );
            }
            
        } 
        .animate{
            height: 250px;
            width: 200px;
            margin-top: 150px;
            margin-left: 200px;
            padding: auto;
            background-color: rgb(5, 183, 43);
            border: 10px solid brown;
            animation-name: spin;
            animation-duration: 3s;
            animation-iteration-count: 5;
            animation-delay: 2s;
            animation-fill-mode:backwards;
            

        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child"></div>
    </div>
    <div class="animate">

    </div>
    
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>3x3 Table</title>
    <style>
        table,td,th{
            border: 2px solid black;
        }

        table{
         border-collapse: collapse;
        }
        th,td{
        width: 100px;
        height: 30px;    
    text-align: center;
    vertical-align: middle;
    }

    </style>
</head>
<body>

<table border="1">
    <tr>
        <th>Name</th>
        <th>Age</th>
        <th>City</th>
    </tr>

    <tr>
        <td>Rahul</td>
        <td>20</td>
        <td>Delhi</td>
    </tr>

    <tr>
        <td>Amit</td>
        <td>21</td>
        <td>Mumbai</td>
    </tr>
</table>

</body>
</html>
